<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>棋譜検討盤 — 全対局</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&display=swap">
<style>
/* 配色・書体は viewer_template.html と同じトークン */
:root{
  --bg:#F7F7F4; --surface:#FFFFFF; --sunk:#F1F1EC;
  --ink:#1A1A18; --ink2:#55554F; --muted:#8E8E86;
  --rule:#E3E3DC; --rule-strong:#C9C9C0;
  --sente:#1D6FB8; --gote:#C0402F; --gold:#B8892B;
  --sente-soft:rgba(29,111,184,.13); --gote-soft:rgba(192,64,47,.13);
  --shadow:0 1px 2px rgba(26,26,24,.06),0 8px 24px -12px rgba(26,26,24,.14);
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17171A; --surface:#1F1F23; --sunk:#141417;
  --ink:#EDEDE7; --ink2:#B0B0A8; --muted:#7C7C76;
  --rule:#32323A; --rule-strong:#4A4A54;
  --sente-soft:rgba(29,111,184,.22); --gote-soft:rgba(192,64,47,.22);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#17171A; --surface:#1F1F23; --sunk:#141417;
  --ink:#EDEDE7; --ink2:#B0B0A8; --muted:#7C7C76;
  --rule:#32323A; --rule-strong:#4A4A54;
  --sente-soft:rgba(29,111,184,.22); --gote-soft:rgba(192,64,47,.22);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.tnum{font-variant-numeric:tabular-nums}
a{color:inherit}

header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;
  padding-bottom:18px;border-bottom:1px solid var(--rule-strong);margin-bottom:22px}
h1{margin:0;font-family:var(--mincho);font-size:22px;font-weight:600;letter-spacing:.01em}
.sub{font-size:12px;color:var(--muted);letter-spacing:.03em;margin-top:2px}
.stats{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.stat{text-align:right}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--mincho);font-size:24px;font-weight:600;line-height:1.15}
.stat .v small{font-size:12px;color:var(--muted);font-family:var(--sans);font-weight:400}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  box-shadow:var(--shadow);margin-bottom:22px}
.card h2{margin:0;padding:11px 14px;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--rule)}

/* 対局一覧：1行＝1局。狭い画面では列を畳む */
.games{display:grid;grid-template-columns:auto 1fr auto auto auto auto;align-items:center}
.games>a,.games>.h{display:contents}
.games>.h>span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:8px 10px;border-bottom:1px solid var(--rule)}
.games>a>span{padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
.games>a:last-child>span{border-bottom:0}
.games>a[hidden]{display:none}
/* 月の見出し。押すとその月を開閉する */
.games>.m{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;width:100%;
  font:inherit;text-align:left;color:var(--ink);background:var(--sunk);cursor:pointer;
  border:0;border-bottom:1px solid var(--rule);padding:8px 10px}
.games>.m:hover{background:var(--rule)}
.games>.m b{font-family:var(--mincho);font-size:15px;font-weight:600}
.games>.m small{font-size:12px;color:var(--ink2)}
.games>.m i{font-style:normal;font-size:10px;color:var(--muted);width:10px}
.games>a{text-decoration:none}
.games>a:hover>span{background:var(--sunk)}
.games .d{font-size:12px;color:var(--ink2)}
.games .opp{font-family:var(--mincho);font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.games .op{font-size:12px;color:var(--ink2)}
.games .mk{font-family:var(--mincho);font-size:15px}
.games .mk.b{color:var(--sente)} .games .mk.w{color:var(--gote)}
.games .res{font-family:var(--mincho);font-weight:700;text-align:center}
.games .res.win{color:var(--sente)} .games .res.lose{color:var(--gote)} .games .res.draw{color:var(--muted)}
.games .loss{text-align:right}
@media(max-width:560px){
  .games{grid-template-columns:1fr auto auto auto auto}
  .games .d{display:none}
}

/* 相手の段級で絞る */
.filter{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.filter>div{display:flex;flex-wrap:wrap;gap:6px}
.filter button{font:inherit;font-size:12px;color:var(--ink2);background:none;cursor:pointer;
  border:1px solid var(--rule-strong);border-radius:999px;padding:3px 11px}
.filter button small{color:var(--muted);margin-left:4px}
.filter button:hover{background:var(--sunk)}
.filter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.filter button[aria-pressed="true"] small{color:inherit;opacity:.7}

.note{font-size:11px;color:var(--muted);padding:9px 14px;border-top:1px solid var(--rule);line-height:1.6}
.msg{padding:32px 14px;color:var(--ink2);text-align:center}
.msg.err{color:var(--gote)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>棋譜検討盤</h1>
    <div class="sub"><span id="who"></span> の将棋ウォーズ 全対局 · やねうら王＋水匠5で解析</div>
  </div>
  <div class="stats" id="stats" hidden>
    <div class="stat"><div class="k">対局</div><div class="v tnum" id="sGames"></div></div>
    <div class="stat"><div class="k">勝率</div><div class="v tnum" id="sWin"></div></div>
    <div class="stat"><div class="k">平均損失 <small>直近10局</small></div><div class="v tnum" id="sLoss"></div></div>
  </div>
</header>

<div class="card">
  <h2>対局</h2>
  <div class="filter" id="filter" hidden></div>
  <div class="games" id="games"><div class="msg">読み込み中…</div></div>
  <p class="note">平均損失＝1手あたりに失った評価値（自分の手番のみ）。</p>
</div>
</div>

<script type="module">
import { rest, ME, mask } from "./db.js";
const $ = id => document.getElementById(id);
$("who").textContent = ME;

const mySide = g => g.sente === ME ? "b" : g.gote === ME ? "w" : null;
// 月の区切り。今年なら「9月」、去年以前は「2025年12月」
const monthKey = iso => { const d = new Date(iso); return `${d.getFullYear()}-${d.getMonth() + 1}`; };
const monthLabel = key => { const [y, m] = key.split("-"); return +y === new Date().getFullYear() ? `${m}月` : `${y}年${m}月`; };
const fmtDate = iso => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()}`; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

try {
  // 一覧に要る列だけ取る（data は1局50KBあるので、ここでは読まない）
  const games = await rest("games?select=id,played_at,sente,gote,sente_rank,gote_rank,winner,opening_b,opening_w,terminal,moves_count,avg_loss_b,avg_loss_w&order=played_at.desc");
  // 相手のIDは表示しない（db.js の mask）。自分かどうかの判定は ME が残るので変わらない
  for (const g of games) { g.sente = mask(g.sente); g.gote = mask(g.gote); }

  // 2級以下はまとめる。低い級でも強い人（サブ垢など）が混ざるので、細かく分けても意味が薄い
  const LOW = "2級以下";
  const oppRankOf = g => {
    const r = (mySide(g) === "b" ? g.gote_rank : g.sente_rank) || "";
    return parseInt(r) >= 2 && r.endsWith("級") ? LOW : r;
  };
  // 弱い順に並べる。2級以下、1級、初段、二段…
  const DAN = "初二三四五六七八九";
  const strength = r => r === LOW ? -2 : /^(\d+)級$/.test(r) ? -parseInt(r) : DAN.includes(r[0]) && r.endsWith("段") ? DAN.indexOf(r[0]) : -99;

  // ── 絞り込み ──（?rank=初段&side=b で状態を持つので、対局を開いて戻っても残る）
  // 段級と手番は両方かけられる。ボタンの局数は、もう片方の絞り込みをかけた後の数
  const all = games.filter(mySide);
  const ranks = [...new Set(all.map(oppRankOf).filter(Boolean))].sort((a, b) => strength(a) - strength(b));
  const q = new URLSearchParams(location.search);
  // 相手の戦型。列が空の局（sync.py --all の前に送った局）は「不明」
  const oppOpeningOf = g => (mySide(g) === "b" ? g.opening_w : g.opening_b) || "不明";
  const ORDER = ["居飛車", "中飛車", "四間飛車", "三間飛車", "向かい飛車", "不明"];
  const openings = [...new Set(all.map(oppOpeningOf))].sort((a, b) => ORDER.indexOf(a) - ORDER.indexOf(b));
  const f = { rank: q.get("rank"), side: q.get("side"), op: q.get("op") };
  if (!ranks.includes(f.rank)) f.rank = null;
  if (!openings.includes(f.op)) f.op = null;
  if (!["b", "w"].includes(f.side)) f.side = null;

  const pick = ({ rank = f.rank, side = f.side, op = f.op } = {}) =>
    all.filter(g => (!rank || oppRankOf(g) === rank) && (!side || mySide(g) === side)
      && (!op || oppOpeningOf(g) === op));

  function renderFilter() {
    const chip = (key, val, label, n) =>
      `<button type="button" data-key="${key}" data-val="${esc(val)}" aria-pressed="${(f[key] || "") === val}">${esc(label)}<small class="tnum">${n}</small></button>`;
    $("filter").innerHTML =
      `<div>` + chip("side", "", "先後とも", pick({ side: null }).length)
        + chip("side", "b", "先手", pick({ side: "b" }).length)
        + chip("side", "w", "後手", pick({ side: "w" }).length) + `</div>`
      + `<div>` + chip("rank", "", "すべて", pick({ rank: null }).length)
        + ranks.map(r => chip("rank", r, r, pick({ rank: r }).length)).join("") + `</div>`
      + `<div>` + chip("op", "", "相手の戦型すべて", pick({ op: null }).length)
        + openings.map(o => chip("op", o, o, pick({ op: o }).length)).join("") + `</div>`;
    $("filter").hidden = false;
  }
  // 開いている月（?open=2026-9,2026-8）。指定がなければ最新の月だけ開く
  const open = new Set(q.has("open") ? q.get("open").split(",").filter(Boolean)
    : games.length ? [monthKey(games[0].played_at)] : []);
  $("games").addEventListener("click", e => {
    const b = e.target.closest("button.m");
    if (!b) return;
    const k = b.dataset.month;
    open.has(k) ? open.delete(k) : open.add(k);
    const u = new URL(location.href);
    u.searchParams.set("open", [...open].join(","));
    history.replaceState(null, "", u);
    render();
  });

  $("filter").addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    f[b.dataset.key] = b.dataset.val || null;
    const u = new URL(location.href);
    for (const k in f) f[k] ? u.searchParams.set(k, f[k]) : u.searchParams.delete(k);
    history.replaceState(null, "", u);
    render();
  });

  function render() {
    renderFilter();
    const filtered = f.rank || f.side || f.op;
    const shown = filtered ? pick() : games;

    // ── 一覧 ── 月ごとに見出しを挟み、閉じている月の行は隠す
    const byMonth = new Map();
    for (const g of shown) {
      const k = monthKey(g.played_at);
      byMonth.has(k) || byMonth.set(k, []);
      byMonth.get(k).push(g);
    }
    const monthHead = (k, gs) => {
      const w = gs.filter(g => mySide(g) && g.winner === mySide(g)).length;
      const l = gs.filter(g => mySide(g) && g.winner && g.winner !== mySide(g)).length;
      return `<button type="button" class="m" data-month="${k}" aria-expanded="${open.has(k)}">
        <i>${open.has(k) ? "▼" : "▶"}</i><b>${monthLabel(k)}</b><small class="tnum">${gs.length}局 ${w}勝${l}敗</small></button>`;
    };
    const row = g => {
      const me = mySide(g);
      const oppRank = me === "b" ? g.gote_rank : g.sente_rank;
      const res = !g.winner ? "draw" : g.winner === me ? "win" : "lose";
      const resLabel = { win: "●", lose: "●", draw: "△" }[res];
      const loss = me === "b" ? g.avg_loss_b : me === "w" ? g.avg_loss_w : g.avg_loss_b;
      return `<a href="game.html?id=${g.id}"${open.has(monthKey(g.played_at)) ? "" : " hidden"} title="${esc(g.terminal || "")} ${g.moves_count}手">
        <span class="d tnum">${fmtDate(g.played_at)}</span>
        <span class="opp">${esc(oppRank || "–")}</span>
        <span class="op">${esc(me ? oppOpeningOf(g) : "")}</span>
        <span class="mk ${me || ""}">${me === "b" ? "先手" : me === "w" ? "後手" : "–"}</span>
        <span class="res ${res}">${resLabel}</span>
        <span class="loss tnum">${loss}</span>
      </a>`;
    };
    const rows = [...byMonth].map(([k, gs]) => monthHead(k, gs) + gs.map(row).join(""));
    $("games").innerHTML = shown.length
      ? `<div class="h"><span>日付</span><span>相手</span><span>戦型</span><span>手番</span><span>結果</span><span style="text-align:right">損失</span></div>` + rows.join("")
      : `<div class="msg">まだ対局がありません（Mac で python3 sync.py）</div>`;

    // ── まとめ ──
    const played = shown.filter(mySide);
    const wins = played.filter(g => g.winner === mySide(g)).length;
    const recent = played.slice(0, 10);
    const avg = recent.length
      ? Math.round(recent.reduce((s, g) => s + (mySide(g) === "b" ? g.avg_loss_b : g.avg_loss_w), 0) / recent.length) : 0;
    $("sGames").innerHTML = filtered ? `${played.length}<small> ${wins}勝${played.length - wins}敗</small>` : played.length;
    $("sWin").innerHTML = played.length ? `${Math.round(wins / played.length * 100)}<small>%</small>` : "–";
    $("sLoss").textContent = avg;
    $("stats").hidden = false;
  }
  render();
} catch (err) {
  $("games").innerHTML = `<div class="msg err">${esc(err.message)}</div>`;
  console.error(err);
}
</script>
</body>
</html>
